<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&amp;family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .fr { font-family: "Fraunces", serif; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; z-index: 5; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: #dfdce6; }
  .progress span.active { background: #5d3b97; }
  .mark { position: absolute; right: 84px; bottom: 78px; width: 52px; height: auto; opacity: 0.9; z-index: 5; }
  .hatch { background: repeating-linear-gradient(135deg, #8a77ad 0 3px, #6b5a8f 3px 26px); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; text-align: center; line-height: 1.6; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #faf8fc; font-family: 'Archivo', sans-serif; color: #211c2b; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #faf8fc; padding: 70px; }
  .frame { position: absolute; inset: 40px; border: 3px solid #503484; border-radius: 12px; }
  .frame::after { content: ''; position: absolute; inset: 10px; border: 1px solid #503484; border-radius: 6px; }
  .in { position: relative; height: 100%; padding: 30px 44px 100px; display: flex; flex-direction: column; }
  .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #5f5b68; }
  h2 { font-family: 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; font-weight: 800; font-size: 96px; line-height: 0.96; letter-spacing: -0.04em; color: #503484; margin-top: 26px; max-width: 11ch; }
  .rows { margin-top: 60px; }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 26px 0; border-top: 2px solid #dfdce6; }
  .row:last-child { border-bottom: 2px solid #dfdce6; }
  .row .n { font-family: 'Petrona', serif; font-weight: 600; font-size: 40px; color: #211c2b; }
  .row .dots { flex: 1; border-bottom: 3px dotted #b9b3c7; transform: translateY(-8px); }
  .row .v { font-family: 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; font-weight: 800; font-size: 96px; letter-spacing: -0.04em; color: #a24112; line-height: 1; }
  .row .v small { font-size: 44px; }
  .row.brand .v { color: #5d3b97; }
  .note { margin-top: auto; font-size: 24px; line-height: 1.5; color: #54505f; max-width: 40ch; }
  .mark { z-index: 5; }
</style>
</head>
<body>
<div class="slide">
  <div class="frame"></div>
  <div class="in">
    <div class="eyebrow">Laudo de cromatografia · Lote 00</div>
    <h2>Os compostos que aparecem</h2>
    <div class="rows">
      <div class="row"><span class="n">Composto 1</span><span class="dots"></span><span class="v">00,0<small>%</small></span></div>
      <div class="row brand"><span class="n">Composto 2</span><span class="dots"></span><span class="v">00,0<small>%</small></span></div>
      <div class="row"><span class="n">Composto 3</span><span class="dots"></span><span class="v">00,0<small>%</small></span></div>
    </div>
    <div class="note">Nota curta: o que o laudo mostra e o que ele não promete.</div>
  </div>
  <img class="mark" src="../../../assets/logos/mark.png" alt="">
  <div class="progress"><span></span><span class="active"></span></div>
</div>
</body>
</html>
