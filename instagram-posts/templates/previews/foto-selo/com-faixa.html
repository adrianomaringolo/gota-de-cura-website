<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:wght@600&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #503484; font-family: 'Archivo', sans-serif; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #503484; }
  .photo { position: absolute; inset: 0; width: 1080px; height: 1350px; object-fit: cover;
    background: repeating-linear-gradient(135deg, #b9a9d3 0 3px, #d9cfe6 3px 26px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 200px;
    font-size: 24px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #291945; text-align: center; }
  .photo small { display: block; font-size: 19px; font-weight: 500; letter-spacing: 0.04em; text-transform: none; margin-top: 12px; color: #3a2a57; }
  .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
    background: linear-gradient(0deg, rgba(41,25,69,0.82) 0%, rgba(41,25,69,0) 100%); }
  .faixa { position: absolute; left: 88px; bottom: 96px; width: 600px; }
  .faixa h1 { font-family: 'Petrona', serif; font-weight: 600; font-size: 56px; line-height: 1.05; letter-spacing: -0.02em; color: #ffffff; }
  .faixa p { font-size: 26px; line-height: 1.4; color: #ffffff; margin-top: 12px; }
  .selo { position: absolute; right: 24px; bottom: 24px; width: 300px; height: auto; }
</style>
</head>
<body>
<div class="slide">
  <div class="photo">FOTO · foto.jpg · 1080×1350<small>Faixa de texto no rodapé, selo à direita</small></div>
  <div class="scrim"></div>
  <div class="faixa">
    <h1>Frase curta que nomeia a cena</h1>
    <p>Uma linha de apoio, opcional.</p>
  </div>
  <img class="selo" src="../../../assets/logos/selo-gota.png" alt="">
</div>
</body>
</html>
