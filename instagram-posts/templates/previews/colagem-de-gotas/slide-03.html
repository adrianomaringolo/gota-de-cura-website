<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&amp;family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .fr { font-family: "Fraunces", serif; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; z-index: 5; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: #dfdce6; }
  .progress span.active { background: #5d3b97; }
  .mark { position: absolute; right: 84px; bottom: 78px; width: 52px; height: auto; opacity: 0.9; z-index: 5; }
  .hatch { background: repeating-linear-gradient(135deg, #8a77ad 0 3px, #6b5a8f 3px 26px); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; text-align: center; line-height: 1.6; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #291945; font-family: 'Archivo', sans-serif; color: #fff; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #291945; padding: 96px 88px; display: flex; flex-direction: column; }
  .drop { position: absolute; border-radius: 0 50% 50% 50%; transform: rotate(-45deg); }
  .a { width: 560px; height: 560px; right: -150px; bottom: -120px; background: #503484; }
  .b { width: 260px; height: 260px; right: 250px; bottom: 330px; border: 8px solid #cd632d; }
  .logo { position: relative; width: 270px; height: auto; filter: brightness(0) invert(1); }
  .t { position: relative; margin-top: auto; padding-bottom: 60px; font-family: 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; font-weight: 800; font-size: 120px; line-height: 0.94; letter-spacing: -0.04em; max-width: 8ch; }
  .t em { font-weight: 600; color: #f0c8ae; }
  .url { position: relative; font-family: 'Petrona', serif; font-weight: 600; font-size: 60px; color: #dacbf9; }
  .sub { position: relative; font-size: 25px; line-height: 1.5; color: rgba(255,255,255,0.68); margin: 18px 0 140px; max-width: 34ch; }
  .progress span { background: rgba(255,255,255,0.3); } .progress span.active { background: #dacbf9; }
</style>
</head>
<body>
<div class="slide">
  <div class="drop a"></div><div class="drop b"></div>
  <img class="logo" src="../../../assets/logos/logo.png" alt="Gota de Cura">
  <div class="t">Frase de <em>fecho</em></div>
  <div class="url">gotadecura.com.br</div>
  <div class="sub">Linha de apoio com a nota da Morada ou o convite para a visita.</div>
  <div class="progress"><span></span><span></span><span class="active"></span></div>
</div>
</body>
</html>
