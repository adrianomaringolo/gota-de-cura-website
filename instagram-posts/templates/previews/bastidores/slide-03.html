<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #faf8fc;
    font-family: 'Archivo', sans-serif;
    color: #211c2b;
  }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 120px 88px 180px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; }
  .blob { position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(93,59,151,0.10) 0%, transparent 70%);
    top: -200px; right: -180px; pointer-events: none; }
  .rule-mark { color: #5d3b97; }
  .rule-mark::before { content: ''; display: block; width: 44px; height: 2px;
    background: currentColor; opacity: 0.45; margin-bottom: 20px; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 62px; line-height: 1.08; color: #503484; max-width: 17ch; }
  .lead { font-size: 30px; line-height: 1.55; color: #54505f; margin-top: 22px; max-width: 34ch; }

  /* Foto de apoio em moldura (opcional neste slide) */
  .frame { margin-top: 44px; height: 360px; border-radius: 24px;
    background: repeating-linear-gradient(135deg, #d9cfe6 0 3px, #eee9f4 3px 26px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #54505f; }
  .frame small { font-size: 17px; font-weight: 500; letter-spacing: 0.04em; text-transform: none; margin-top: 8px; color: #5f5b68; }

  /* Linha do processo: a etapa deste slide em destaque */
  .steps { margin-top: 56px; display: grid; grid-template-columns: repeat(4, 1fr); position: relative; }
  .steps::before { content: ''; position: absolute; top: 15px; left: 12.5%; right: 12.5%; height: 2px; background: #dfdce6; }
  .step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .dot { width: 32px; height: 32px; border-radius: 50%; background: #faf8fc; border: 2px solid #dfdce6; }
  .step.done .dot { background: #dacbf9; border-color: #dacbf9; }
  .step.now .dot { background: #5d3b97; border-color: #5d3b97; box-shadow: 0 0 0 8px #f3ecff; }
  .step p { font-size: 19px; font-weight: 600; color: #5f5b68; margin-top: 16px; }
  .step.now p { color: #503484; font-weight: 700; }

  .mark { position: absolute; right: 84px; bottom: 78px; width: 52px; height: auto; opacity: 0.9; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: #dfdce6; }
  .progress span.active { background: #5d3b97; }
</style>
</head>
<body>
<div class="slide">
  <div class="blob"></div>

  <div class="rule-mark"></div>
  <h1>O que está acontecendo nesta etapa</h1>
  <p class="lead">Explicação curta do processo por trás da cena anterior, em linguagem de leigo.</p>

  <div class="frame">Foto de apoio (opcional)<small>detalhe.jpg · 16:9 · o detalhe que a cena não mostrou</small></div>

  <div class="steps">
    <div class="step done"><span class="dot"></span><p>Colheita</p></div>
    <div class="step now"><span class="dot"></span><p>Destilação</p></div>
    <div class="step"><span class="dot"></span><p>Separação</p></div>
    <div class="step"><span class="dot"></span><p>Envase</p></div>
  </div>

  <div class="progress"><span></span><span></span><span class="active"></span><span></span><span></span></div>
  <img class="mark" src="../_assets/mark.png" alt="">
</div>
</body>
</html>
