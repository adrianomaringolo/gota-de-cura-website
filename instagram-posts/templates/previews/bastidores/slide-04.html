<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #291945;
    font-family: 'Archivo', sans-serif;
    color: #ffffff;
  }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 100px 88px 180px;
    overflow: hidden; background: #291945; display: flex; flex-direction: column; justify-content: center; }
  .blob { position: absolute; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(137,97,199,0.30) 0%, transparent 70%);
    top: -240px; right: -220px; pointer-events: none; }
  .logo { width: 270px; height: auto; align-self: flex-start; filter: brightness(0) invert(1); margin-bottom: 48px; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 66px; line-height: 1.07; max-width: 15ch; }
  h1 em { font-style: italic; font-weight: 500; color: #f0c8ae; }
  .body { font-size: 30px; line-height: 1.5; color: rgba(255,255,255,0.78); margin-top: 26px; max-width: 32ch; }
  .cta { display: inline-flex; align-items: center; gap: 18px; margin-top: 52px; align-self: flex-start;
    background: #ffffff; color: #503484;
    font-size: 34px; font-weight: 700; letter-spacing: -0.01em;
    padding: 28px 44px; border-radius: 999px;
    box-shadow: 0 12px 38px rgba(41,25,69,0.48); }
  .cta svg { width: 30px; height: 30px; }
  .sub { font-size: 25px; line-height: 1.55; color: rgba(255,255,255,0.68); margin-top: 30px; max-width: 42ch; }
  .handle { position: absolute; right: 88px; bottom: 88px; font-size: 20px; color: rgba(255,255,255,0.7); }
  .handle em { color: #dacbf9; font-style: normal; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .progress span.active { background: #dacbf9; }
</style>
</head>
<body>
<div class="slide">
  <div class="blob"></div>

  <img class="logo" src="../_assets/logo.png" alt="Gota de Cura">
  <h1>Convite para <em>ver de perto</em></h1>
  <p class="body">Uma ou duas frases ligando a cena ao que o leitor pode viver na visita.</p>
  <div class="cta">
    <span>gotadecura.com.br/visitas</span>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
  </div>
  <p class="sub">Nota da Morada Espírita Prof. Lairi Hans, quando couber.</p>

  <div class="progress"><span></span><span></span><span></span><span></span><span class="active"></span></div>
  <div class="handle"><em>@</em>gotadecura_artesanais</div>
</div>
</body>
</html>
