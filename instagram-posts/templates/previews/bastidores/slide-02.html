<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #291945;
    font-family: 'Archivo', sans-serif;
    color: #ffffff;
  }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #291945; }

  /* Slide de cena: foto em tela cheia, sem título. No post real: <img class="photo" src="cena-02.jpg"> */
  .photo { position: absolute; inset: 0;
    background: repeating-linear-gradient(135deg, #7b6f62 0 3px, #5a5048 3px 26px); }
  .photo-label { position: absolute; top: 460px; left: 0; right: 0; text-align: center;
    font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.9); }
  .photo-label small { display: block; font-size: 18px; font-weight: 500; letter-spacing: 0.06em; text-transform: none; margin-top: 10px; color: rgba(255,255,255,0.75); }
  .scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(41,25,69,0) 0%, rgba(41,25,69,0) 58%, rgba(41,25,69,0.86) 86%, rgba(41,25,69,0.94) 100%); }

  .caption { position: absolute; left: 88px; right: 88px; bottom: 180px; }
  .time { font-family: 'Petrona', serif; font-style: italic; font-weight: 500; font-size: 46px; color: #f0c8ae; }
  .caption p { font-size: 34px; line-height: 1.45; color: rgba(255,255,255,0.92); margin-top: 12px; max-width: 34ch; }

  .mark { position: absolute; right: 84px; bottom: 78px; width: 52px; height: auto; filter: brightness(0) invert(1); opacity: 0.9; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .progress span.active { background: #dacbf9; }
</style>
</head>
<body>
<div class="slide">
  <div class="photo"></div>
  <p class="photo-label">Foto da cena<small>cena-02.jpg · 1080×1350 · ação acontecendo, terço de baixo mais calmo</small></p>
  <div class="scrim"></div>

  <div class="caption">
    <p class="time">Marcador de tempo</p>
    <p>Legenda da cena em uma ou duas frases, no presente, como diário da chácara.</p>
  </div>

  <div class="progress"><span></span><span class="active"></span><span></span><span></span><span></span></div>
  <img class="mark" src="../_assets/mark.png" alt="">
</div>
</body>
</html>
