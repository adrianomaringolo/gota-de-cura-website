<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #291945;
    font-family: 'Archivo', sans-serif;
    color: #ffffff;
  }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #291945; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo-ph { position: absolute; inset: 0;
    background: repeating-linear-gradient(135deg, #6a5a86 0 3px, #4b3a6b 3px 26px); }
  .photo-label { position: absolute; top: 470px; left: 0; right: 0; text-align: center;
    font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.9); }
  .photo-label small { display: block; font-size: 18px; font-weight: 500; letter-spacing: 0.06em; text-transform: none; margin-top: 10px; color: rgba(255,255,255,0.7); }
  .scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(41,25,69,0.58) 0%, rgba(41,25,69,0.20) 28%, rgba(41,25,69,0.38) 50%, rgba(41,25,69,0.94) 100%); }
  .content { position: absolute; inset: 0; padding: 100px 88px; display: flex; flex-direction: column; }
  .logo { width: 300px; height: auto; align-self: flex-start; filter: brightness(0) invert(1); }
  .headline { margin-top: auto; padding-bottom: 80px; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 108px; line-height: 1.02; max-width: 12ch; }
  h1 em { font-style: italic; font-weight: 500; color: #f0c8ae; }
  .sub { font-size: 40px; line-height: 1.45; color: rgba(255,255,255,0.88); margin-top: 30px; max-width: 26ch; }
  .handle { position: absolute; right: 88px; bottom: 88px; font-size: 20px; color: rgba(255,255,255,0.8); }
  .handle em { color: #dacbf9; font-style: normal; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .progress span.active { background: #dacbf9; }
</style>
</head>
<body>
<div class="slide">
  <div class="photo-ph"></div>
  <p class="photo-label">Foto de capa<small>cover.jpg · 1080×1350 · foto natural, área calma no terço de baixo</small></p>
  <div class="scrim"></div>

  <div class="content">
    <img class="logo" src="../_assets/logo.png" alt="Gota de Cura">
    <div class="headline">
      <h1>Título da lista que <em>para o scroll</em></h1>
      <p class="sub">Subtítulo que diz o que vem nos próximos slides.</p>
    </div>
  </div>

  <div class="progress"><span class="active"></span><span></span><span></span><span></span></div>
  <div class="handle"><em>@</em>gotadecura_artesanais</div>
</div>
</body>
</html>
