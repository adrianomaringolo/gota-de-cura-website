<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #503484;
    font-family: 'Archivo', sans-serif;
    color: #ffffff;
  }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #503484; }

  /* Faixa de foto à direita. No post real: <img class="photo"> + camadas duotone
     (.photo-duo-shadow lighten #2a1a48, .photo-duo-light darken #f1cebb). */
  .photo { position: absolute; top: 0; right: 0; width: 330px; height: 100%;
    background: repeating-linear-gradient(135deg, #b9a3a8 0 3px, #7c648f 3px 26px); }
  .photo-label { position: absolute; top: 600px; right: 30px; width: 270px; text-align: center; background: rgba(41,25,69,0.78); padding: 18px 12px; border-radius: 14px;
    font-size: 19px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #ffffff; line-height: 1.4; }
  .photo-label small { display: block; font-size: 16px; font-weight: 500; letter-spacing: 0.04em; text-transform: none; margin-top: 8px; color: rgba(255,255,255,0.85); }
  .photo-fade { position: absolute; top: 0; right: 330px; width: 96px; height: 100%;
    background: linear-gradient(90deg, #503484 0%, rgba(80,52,132,0) 100%); }

  .blob { position: absolute; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(137,97,199,0.32) 0%, transparent 70%);
    top: -260px; left: -240px; pointer-events: none; }

  .content { position: absolute; top: 0; left: 0; width: 750px; height: 100%;
    padding: 96px 60px 96px 88px; display: flex; flex-direction: column; }
  .logo { width: 320px; height: auto; align-self: flex-start; filter: brightness(0) invert(1); }

  .icon { width: 72px; height: 72px; margin-top: 76px; color: #dacbf9; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 66px; line-height: 1.08; margin-top: 34px; }
  h1 .accent { font-style: italic; font-weight: 500;
    background: linear-gradient(#cd632d, #cd632d) left 92% / 100% 5px no-repeat;
    padding-bottom: 4px; }
  .lead { font-size: 29px; line-height: 1.55; color: rgba(255,255,255,0.82);
    margin-top: 26px; max-width: 30ch; }
  .lead strong { color: #ffffff; font-weight: 600; }
  .note { font-size: 25px; line-height: 1.5; color: #dacbf9; margin-top: 26px; max-width: 30ch; }

  .cta { display: flex; align-items: center; gap: 16px; margin-top: auto;
    background: #ffffff; color: #503484;
    font-size: 26px; font-weight: 700; letter-spacing: -0.01em;
    padding: 24px 34px; border-radius: 999px; align-self: flex-start;
    box-shadow: 0 12px 38px rgba(41,25,69,0.48); }
  .cta svg { width: 28px; height: 28px; }
</style>
</head>
<body>
<div class="slide">
  <div class="photo"></div>
  <p class="photo-label">Faixa de foto<small>cover.jpg · vertical<br>duotone lilás/terracota</small></p>
  <div class="photo-fade"></div>
  <div class="blob"></div>

  <div class="content">
    <img class="logo" src="../_assets/logo.png" alt="Gota de Cura">

    <!-- Lucide: flask-conical -->
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2" /><path d="M6.453 15h11.094" /><path d="M8.5 2h7" /></svg>

    <h1>Afirmação de confiança, <span class="accent">o trecho que fica</span></h1>
    <p class="lead">Explicação em linguagem de leigo, com <strong>uma palavra</strong> em destaque. Três a cinco linhas.</p>
    <p class="note">Frase curta que diz ao leitor o que isso muda para ele.</p>

    <div class="cta">
      <span>gotadecura.com.br/pagina</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
    </div>
  </div>
</div>
</body>
</html>
