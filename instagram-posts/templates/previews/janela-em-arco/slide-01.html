<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f3ecff; font-family: 'Archivo', sans-serif; color: #211c2b; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #f3ecff; }
  .sun { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: #cd632d; left: 330px; top: 200px; }
  .arch { position: absolute; right: 60px; top: 150px; width: 560px; height: 1300px; border-radius: 280px 280px 0 0; overflow: hidden;
    background: repeating-linear-gradient(135deg, #8a77ad 0 3px, #6b5a8f 3px 26px); display: flex; align-items: flex-start; justify-content: center; padding-top: 520px;
    color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; text-align: center; line-height: 1.6; }
  .logo { position: absolute; left: 88px; top: 80px; width: 280px; height: auto; }
  h1 { position: absolute; left: 88px; top: 560px; font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.03em; font-size: 124px; line-height: 0.98; color: #503484; max-width: 6ch; }
  h1 em { font-style: italic; font-weight: 500; color: #a24112; }
  .sub { position: absolute; left: 88px; bottom: 200px; width: 320px; font-size: 28px; line-height: 1.5; color: #54505f; }
  .sub::before { content: ''; display: block; width: 44px; height: 2px; background: #5d3b97; opacity: 0.45; margin-bottom: 20px; }
  .handle { position: absolute; left: 88px; bottom: 88px; font-size: 20px; color: #5f5b68; } .handle em { font-style: normal; color: #5d3b97; }
</style>
</head>
<body>
<div class="slide">
  <div class="sun"></div>
  <div class="arch">FOTO EM ARCO<br>foto.jpg · 560×1200</div>
  <img class="logo" src="../../../assets/logos/logo.png" alt="Gota de Cura">
  <h1>Título <em>curto</em> aqui</h1>
  <div class="sub">Frase de apoio de até duas linhas.</div>
  <div class="handle"><em>@</em>gotadecura_artesanais</div>
</div>
</body>
</html>
