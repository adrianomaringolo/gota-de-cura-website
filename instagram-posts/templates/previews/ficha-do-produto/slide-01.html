<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #faf8fc;
    font-family: 'Archivo', sans-serif;
    color: #211c2b;
  }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #faf8fc; }

  /* Foto sangrada no topo. No post real: <img class="photo" src="produto.jpg"> com object-fit: cover */
  .photo { position: absolute; top: 0; left: 0; width: 1080px; height: 860px;
    background: repeating-linear-gradient(135deg, #b9a9d3 0 3px, #d9cfe6 3px 26px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #291945; }
  .photo small { display: block; font-size: 18px; font-weight: 500; letter-spacing: 0.04em; text-transform: none; margin-top: 10px; color: #3a2a57; }
  /* Scrim só no topo, para o logo branco ler sobre foto clara */
  .scrim { position: absolute; top: 0; left: 0; right: 0; height: 320px;
    background: linear-gradient(180deg, rgba(41,25,69,0.55) 0%, rgba(41,25,69,0) 100%); }
  .logo { position: absolute; top: 88px; left: 88px; width: 300px; height: auto; filter: brightness(0) invert(1); }

  .panel { position: absolute; top: 860px; left: 0; right: 0; bottom: 0; padding: 64px 88px 0;
    border-top: 5px solid #5d3b97; }
  .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #a24112; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.03em;
    font-size: 96px; line-height: 1; color: #503484; margin-top: 16px; }
  .sub { font-size: 30px; line-height: 1.5; color: #54505f; margin-top: 20px; max-width: 40ch; }
  .sub b { font-weight: 600; color: #211c2b; }

  .handle { position: absolute; right: 88px; bottom: 88px; font-size: 20px; color: #5f5b68; }
  .handle em { color: #5d3b97; font-style: normal; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: #dfdce6; }
  .progress span.active { background: #5d3b97; }
</style>
</head>
<body>
<div class="slide">
  <div class="photo">Foto do produto<small>produto.jpg · o produto real, sem fundo poluído · mín. 1200 px de largura</small></div>
  <div class="scrim"></div>
  <img class="logo" src="../_assets/logo.png" alt="Gota de Cura">

  <div class="panel">
    <p class="eyebrow">Categoria · Linha ou novidade</p>
    <h1>Nome do produto</h1>
    <p class="sub"><b>Tamanho</b> · Frase curta que diz o que o produto é.</p>
  </div>

  <div class="progress"><span class="active"></span><span></span><span></span><span></span></div>
  <div class="handle"><em>@</em>gotadecura_artesanais</div>
</div>
</body>
</html>
