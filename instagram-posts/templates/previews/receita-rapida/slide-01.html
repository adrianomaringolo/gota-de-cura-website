<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #dacbf9; font-family: 'Archivo', sans-serif; color: #211c2b; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #dacbf9; }
  .blob { position: absolute; width: 820px; height: 820px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 68%); top: -200px; right: -220px; }
  .logo { position: absolute; left: 88px; top: 80px; width: 280px; height: auto; }
  .paper { position: absolute; left: 90px; right: 90px; top: 250px; bottom: 210px; background: #fff; border-radius: 26px; padding: 74px 64px 56px;
    transform: rotate(-1.6deg); box-shadow: 0 24px 60px rgba(41,25,69,0.30); }
  .tape { position: absolute; left: 50%; top: -26px; width: 210px; height: 54px; margin-left: -105px; background: rgba(205,99,45,0.78); transform: rotate(3deg); border-radius: 4px; }
  .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5f5b68; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em; font-size: 82px; line-height: 1.04; color: #503484; margin-top: 14px; max-width: 14ch; }
  h1 em { font-style: italic; font-weight: 500; color: #a24112; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .chips span { font-size: 27px; font-weight: 600; color: #503484; background: #f3ecff; padding: 12px 24px; border-radius: 999px; }
  .steps { margin-top: 40px; display: flex; flex-direction: column; gap: 26px; }
  .step { display: flex; gap: 24px; align-items: flex-start; }
  .step b { flex: none; width: 52px; height: 52px; border-radius: 50%; background: #5d3b97; color: #fff; font-family: 'Petrona', serif; font-size: 30px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .step p { font-size: 32px; line-height: 1.42; color: #3a3546; padding-top: 6px; max-width: 28ch; }
  .note { position: absolute; left: 64px; right: 64px; bottom: 50px; font-size: 22px; color: #54505f; border-top: 2px dotted #cfc9dc; padding-top: 20px; }
  .handle { position: absolute; right: 88px; bottom: 72px; font-size: 20px; color: #3a2a63; } .handle em { font-style: normal; color: #503484; }
</style>
</head>
<body>
<div class="slide">
  <div class="blob"></div>
  <img class="logo" src="../../../assets/logos/logo.png" alt="Gota de Cura">
  <div class="paper">
    <div class="tape"></div>
    <div class="eyebrow">Receita rápida · 5 minutos</div>
    <h1>Nome da <em>receita</em></h1>
    <div class="chips"><span>Ingrediente 1</span><span>Ingrediente 2</span><span>Ingrediente 3</span></div>
    <div class="steps">
      <div class="step"><b>1</b><p>Primeiro passo, curto e no imperativo.</p></div>
      <div class="step"><b>2</b><p>Segundo passo, uma ação só.</p></div>
      <div class="step"><b>3</b><p>Terceiro passo e como usar.</p></div>
    </div>
    <div class="note">Cuidado ou como guardar, em uma linha.</div>
  </div>
  <div class="handle"><em>@</em>gotadecura_artesanais</div>
</div>
</body>
</html>
