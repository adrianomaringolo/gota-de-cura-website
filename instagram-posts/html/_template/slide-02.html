<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #faf8fc;
    font-family: 'Archivo', sans-serif;
    color: #211c2b;
  }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 100px 88px; overflow: hidden; }
  .blob { position: absolute; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(93,59,151,0.10) 0%, transparent 70%);
    top: -180px; right: -140px; pointer-events: none; }
  .rule-mark { color: #5d3b97; }
  .rule-mark::before { content: ''; display: block; width: 44px; height: 2px;
    background: currentColor; opacity: 0.45; margin-bottom: 20px; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 68px; line-height: 1.08; color: #503484; max-width: 16ch; }
  .sci { font-family: 'Petrona', serif; font-style: italic; font-size: 30px; color: #54505f; margin-top: 12px; }
  .lead { font-size: 33px; line-height: 1.6; color: #54505f; margin-top: 28px; max-width: 24ch; }
  .card { margin-top: 56px; background: #ffffff; border: 1px solid #dfdce6; border-radius: 24px;
    padding: 44px 48px; box-shadow: 0 6px 20px rgba(41,25,69,0.10); max-width: 780px; }
  .card h2 { font-family: 'Petrona', serif; font-weight: 600; font-size: 27px; color: #211c2b; }
  .card p { font-size: 21px; line-height: 1.6; color: #54505f; margin-top: 10px; }
  .card .flask { float: right; margin-left: 24px; }
  .handle { position: absolute; right: 88px; bottom: 88px; font-size: 20px; color: #5f5b68; }
  .handle em { color: #5d3b97; font-style: normal; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: #dfdce6; }
  .progress span.active { background: #5d3b97; }
</style>
</head>
<body>
<div class="slide">
  <div class="blob"></div>

  <div class="rule-mark"></div>
  <h1>Lavanda, do canteiro ao frasco</h1>
  <p class="sci">Lavandula angustifolia</p>
  <p class="lead">Colhida de manhã, destilada no mesmo dia com água de nascente.</p>

  <div class="card">
    <svg class="flask" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#a24112" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/>
      <path d="M7 15h10"/>
    </svg>
    <h2>Por que a água importa</h2>
    <p>Sem cloro e sem agrotóxico, a destilação preserva o aroma que a planta tem no pé.</p>
  </div>

  <div class="progress"><span></span><span class="active"></span><span></span></div>
  <div class="handle"><em>@</em>gotadecura_artesanais</div>
</div>
</body>
</html>
