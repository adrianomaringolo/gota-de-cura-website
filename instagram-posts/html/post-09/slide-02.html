<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #faf8fc;
    font-family: 'Archivo', sans-serif;
    color: #211c2b;
  }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 120px 88px 180px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; }
  .blob { position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(93,59,151,0.10) 0%, transparent 70%); pointer-events: none; }
  .blob.tr { top: -180px; right: -160px; }
  .blob.bl { bottom: -200px; left: -170px; }
  .count { font-size: 16px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5f5b68; margin-bottom: 18px; }
  .rule-mark { color: #5d3b97; }
  .rule-mark::before { content: ''; display: block; width: 44px; height: 2px;
    background: currentColor; opacity: 0.45; margin-bottom: 20px; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 64px; line-height: 1.08; color: #503484; max-width: 16ch; }
  .lead { font-size: 32px; line-height: 1.55; color: #54505f; margin-top: 24px; max-width: 32ch; }
  .note { font-family: 'Petrona', serif; font-style: italic; font-size: 32px; line-height: 1.35; color: #503484; margin-top: 52px; max-width: 32ch; }
  .mark { position: absolute; right: 84px; bottom: 78px; width: 52px; height: auto; opacity: 0.9; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: #dfdce6; }
  .progress span.active { background: #5d3b97; }
  .cards { margin-top: 56px; display: flex; flex-direction: column; align-items: stretch; }
  .card { background: #ffffff; border: 1px solid #dfdce6; border-radius: 24px;
    padding: 38px 44px; box-shadow: 0 6px 20px rgba(41,25,69,0.10); }
  .card .big { font-family: 'Petrona', serif; font-weight: 600; font-size: 46px; line-height: 1.1; color: #211c2b; }
  .card .big strong { color: #a24112; font-weight: 600; }
  .card.brand .big strong { color: #5d3b97; }
  .card p { font-size: 26px; line-height: 1.5; color: #54505f; margin-top: 12px; }
  .arrow { align-self: center; width: 44px; height: 44px; color: #8961c7; margin: 18px 0; transform: rotate(90deg); }
</style>
</head>
<body>
<div class="slide">
  <div class="blob tr"></div>

  <p class="count">Valor 1 de 5</p>
  <div class="rule-mark"></div>
  <h1>Responsabilidade social</h1>
  <p class="lead">A Gota de Cura existe para sustentar uma obra assistencial.</p>

  <div class="cards">
    <div class="card">
      <p class="big"><strong>Toda a renda</strong> das vendas</p>
      <p>Hidrolatos, óleos essenciais, sabonetes, pomadas e presentes.</p>
    </div>
    <span class="arrow"><!-- Lucide: arrow-right -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></span>
    <div class="card brand">
      <p class="big">vai para a <strong>Morada</strong></p>
      <p>Os trabalhos assistenciais da Morada Espírita Prof. Lairi Hans, em Campinas.</p>
    </div>
  </div>

  <div class="progress"><span></span><span class="active"></span><span></span><span></span><span></span><span></span><span></span></div>
  <img class="mark" src="mark.png" alt="">
</div>
</body>
</html>
