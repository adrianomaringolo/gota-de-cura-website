<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #faf8fc;
    font-family: 'Archivo', sans-serif;
    color: #211c2b;
  }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 120px 88px 180px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; }
  .blob { position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(93,59,151,0.10) 0%, transparent 70%); pointer-events: none; }
  .blob.tr { top: -180px; right: -160px; }
  .blob.bl { bottom: -200px; left: -170px; }
  .count { font-size: 16px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5f5b68; margin-bottom: 18px; }
  .rule-mark { color: #5d3b97; }
  .rule-mark::before { content: ''; display: block; width: 44px; height: 2px;
    background: currentColor; opacity: 0.45; margin-bottom: 20px; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 64px; line-height: 1.08; color: #503484; max-width: 16ch; }
  .lead { font-size: 32px; line-height: 1.55; color: #54505f; margin-top: 24px; max-width: 32ch; }
  .note { font-family: 'Petrona', serif; font-style: italic; font-size: 32px; line-height: 1.35; color: #503484; margin-top: 52px; max-width: 32ch; }
  .mark { position: absolute; right: 84px; bottom: 78px; width: 52px; height: auto; opacity: 0.9; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: #dfdce6; }
  .progress span.active { background: #5d3b97; }
  .grid { margin-top: 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px 32px; }
  .cell { border-top: 3px solid #dacbf9; padding-top: 26px; }
  .cell svg { width: 40px; height: 40px; color: #5d3b97; }
  .cell.warm { border-top-color: #f0c8ae; }
  .cell.warm svg { color: #a24112; }
  .cell h2 { font-family: 'Petrona', serif; font-weight: 600; font-size: 36px; color: #211c2b; margin-top: 16px; }
  .cell p { font-size: 23px; line-height: 1.5; color: #54505f; margin-top: 10px; max-width: 20ch; }
</style>
</head>
<body>
<div class="slide">
  <div class="blob bl"></div>

  <p class="count">Valor 2 de 5</p>
  <div class="rule-mark"></div>
  <h1>Sustentabilidade</h1>

  <div class="grid">
    <div class="cell">
      <!-- Lucide: leaf -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20a10 10 0 0010-10 25.9 25.9 0 00-1.04-7.281 1 1 0 00-1.755-.325C15.833 5.5 13 5.5 9.8 6.1A7 7 0 0011 20" /><path d="M2 21a5 5 0 012.911-4.544C7.613 15.212 8.351 15.24 11 13" /></svg>
      <h2>Ingredientes naturais</h2>
      <p>Na receita, o que vem da natureza.</p>
    </div>
    <div class="cell warm">
      <!-- Lucide: droplets -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z" /><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97" /></svg>
      <h2>Água de nascente</h2>
      <p>É ela que vai para o alambique.</p>
    </div>
    <div class="cell warm">
      <!-- Lucide: sprout -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3" /><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4" /><path d="M5 21h14" /></svg>
      <h2>Adubação natural</h2>
      <p>Os canteiros crescem sem adubo químico.</p>
    </div>
    <div class="cell">
      <!-- Lucide: zap -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z" /></svg>
      <h2>Energia limpa</h2>
      <p>Também na hora de produzir.</p>
    </div>
  </div>

  <p class="note">Sem agrotóxico em nenhum canteiro.</p>

  <div class="progress"><span></span><span></span><span class="active"></span><span></span><span></span><span></span><span></span></div>
  <img class="mark" src="mark.png" alt="">
</div>
</body>
</html>
