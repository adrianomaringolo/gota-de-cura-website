<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #291945;
    font-family: 'Archivo', sans-serif;
    color: #ffffff;
  }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #291945; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%;
    filter: grayscale(1) contrast(1.05) brightness(1.02); }
  .duo-shadow { position: absolute; inset: 0; background: #2a1a48; mix-blend-mode: lighten; }
  .duo-light { position: absolute; inset: 0; background: #f1cebb; mix-blend-mode: darken; }
  .scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(41,25,69,0.58) 0%, rgba(41,25,69,0.26) 28%, rgba(41,25,69,0.42) 52%, rgba(41,25,69,0.94) 100%); }
  .accent-top { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: #cd632d; z-index: 2; }
  .content { position: absolute; inset: 0; padding: 100px 88px; display: flex; flex-direction: column; }
  .logo { width: 300px; height: auto; align-self: flex-start; filter: brightness(0) invert(1); }
  .headline { margin-top: auto; padding-bottom: 80px; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 80px; line-height: 1.05; max-width: 15ch; }
  h1 em { font-style: italic; font-weight: 500; color: #f0c8ae; }
  .sub { font-size: 34px; line-height: 1.5; color: rgba(255,255,255,0.85); margin-top: 28px; max-width: 28ch; }
  .handle { position: absolute; right: 88px; bottom: 88px; font-size: 20px; color: rgba(255,255,255,0.8); }
  .handle em { color: #dacbf9; font-style: normal; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .progress span.active { background: #dacbf9; }
</style>
</head>
<body>
<div class="slide">
  <img class="photo" src="cover.jpg" alt="Grupo de visitantes e voluntárias de avental em pé entre os canteiros da Chácara da Mãe Luzia, com a folhagem em primeiro plano">
  <div class="duo-shadow"></div>
  <div class="duo-light"></div>
  <div class="scrim"></div>
  <div class="accent-top"></div>

  <div class="content">
    <img class="logo" src="logo.png" alt="Gota de Cura">
    <div class="headline">
      <h1>Aqui a causa não vem anexada: <em>ela é o motivo</em></h1>
      <p class="sub">Quatro coisas que explicam por que a Gota de Cura existe.</p>
    </div>
  </div>

  <div class="progress"><span class="active"></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="handle"><em>@</em>gotadecura_artesanais</div>
</div>
</body>
</html>
