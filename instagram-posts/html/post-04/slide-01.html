<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #291945;
    font-family: 'Archivo', sans-serif;
    color: #ffffff;
  }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #291945; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; }
  .scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(41,25,69,0.55) 0%, rgba(41,25,69,0.10) 20%, rgba(41,25,69,0.20) 38%, rgba(41,25,69,0.78) 58%, rgba(41,25,69,0.97) 100%); }
  .content { position: absolute; inset: 0; padding: 96px 88px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .logo { width: 320px; height: auto; filter: brightness(0) invert(1); }
  .foot { margin-top: auto; }
  .tag { display: inline-block; font-size: 19px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: #291945; background: #cd632d; padding: 11px 20px; border-radius: 999px; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.02em;
    font-size: 66px; line-height: 1.08; margin-top: 30px; max-width: 17ch; }
  h1 .paren { display: block; font-size: 44px; color: rgba(255,255,255,0.86); margin-top: 14px; font-style: italic; font-weight: 500; }
  .cta { display: flex; align-items: center; gap: 18px; margin-top: 44px;
    background: #ffffff; color: #503484;
    font-size: 36px; font-weight: 700; letter-spacing: -0.01em;
    padding: 30px 46px; border-radius: 999px; align-self: flex-start;
    box-shadow: 0 12px 38px rgba(41,25,69,0.48); }
  .cta svg { width: 30px; height: 30px; }
</style>
</head>
<body>
<div class="slide">
  <img class="photo" src="cover.jpg" alt="Mulher de roupa clara sentada na cama borrifando hidrolato sobre a roupa de cama, com a névoa fina visível na luz da manhã">
  <div class="scrim"></div>

  <div class="content">
    <div class="top">
      <img class="logo" src="logo.png" alt="Gota de Cura">
    </div>

    <div class="foot">
      <span class="tag">Novo no blog</span>
      <h1>Hidrolato para bebês, gestantes e idosos<span class="paren">quando ele é a escolha mais segura</span></h1>
      <div class="cta">
        <span>gotadecura.com.br/blog</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
