<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #291945;
    font-family: 'Archivo', sans-serif;
    color: #ffffff;
  }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 100px 88px;
    overflow: hidden; background: #291945; display: flex; flex-direction: column; justify-content: center; }
  .blob { position: absolute; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(137,97,199,0.30) 0%, transparent 70%);
    top: -240px; right: -220px; pointer-events: none; }
  .accent-top { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: #cd632d; }
  .logo { width: 270px; height: auto; align-self: flex-start; filter: brightness(0) invert(1); margin-bottom: 44px; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 62px; line-height: 1.08; max-width: 16ch; }
  .body { font-size: 30px; line-height: 1.5; color: rgba(255,255,255,0.78); margin-top: 26px; max-width: 32ch; }
  .url { font-family: 'Petrona', serif; font-weight: 600; font-size: 60px; color: #dacbf9; margin-top: 52px; }
  .sub { font-size: 25px; line-height: 1.5; color: rgba(255,255,255,0.65); margin-top: 18px; max-width: 40ch; }
  .handle { position: absolute; right: 88px; bottom: 88px; font-size: 20px; color: rgba(255,255,255,0.7); }
  .handle em { color: #dacbf9; font-style: normal; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .progress span.active { background: #dacbf9; }
</style>
</head>
<body>
<div class="slide">
  <div class="accent-top"></div>
  <div class="blob"></div>

  <img class="logo" src="logo.png" alt="Gota de Cura">
  <h1>Sabemos o que vai dentro de cada frasco</h1>
  <p class="body">Cada planta que destilamos tem laudo de cromatografia publicado no site.</p>
  <p class="url">gotadecura.com.br</p>
  <p class="sub">Óleos essenciais, diluições e hidrolatos no catálogo. A renda sustenta os trabalhos da Morada Espírita Prof. Lairi Hans.</p>

  <div class="progress"><span></span><span></span><span></span><span></span><span></span><span class="active"></span></div>
  <div class="handle"><em>@</em>gotadecura_artesanais</div>
</div>
</body>
</html>
