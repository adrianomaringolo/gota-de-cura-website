<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #f1eef6;
    font-family: 'Archivo', sans-serif;
    color: #211c2b;
  }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 150px 110px 170px; overflow: hidden;
    background: #f1eef6; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .blob { position: absolute; width: 820px; height: 820px; border-radius: 50%;
    background: radial-gradient(circle, rgba(93,59,151,0.12) 0%, transparent 70%);
    bottom: -300px; left: -260px; pointer-events: none; }
  .rule-mark { color: #5d3b97; }
  .rule-mark::before { content: ''; display: block; width: 44px; height: 2px;
    background: currentColor; opacity: 0.45; margin: 0 auto 28px; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 92px; line-height: 1.06; color: #503484; max-width: 12ch; }
  h1 em { font-style: italic; font-weight: 500; color: #a24112; }
  .sub { font-size: 36px; line-height: 1.55; color: #54505f; margin-top: 40px; max-width: 28ch; }
  .mark { position: absolute; right: 84px; bottom: 78px; width: 52px; height: auto; opacity: 0.9; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: #cfc8dc; }
  .progress span.active { background: #5d3b97; }
</style>
</head>
<body>
<div class="slide">
  <div class="blob"></div>
  <div class="rule-mark"></div>
  <h1>Tudo aqui é feito por <em>muitas mãos</em></h1>
  <p class="sub">Voluntários que plantam, destilam, embalam e atendem. São essas mãos que seguram os cinco valores da Gota de Cura.</p>

  <div class="progress"><span></span><span class="active"></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <img class="mark" src="mark.png" alt="">
</div>
</body>
</html>
