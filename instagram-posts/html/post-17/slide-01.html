<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:wght@600&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #503484; font-family: 'Archivo', sans-serif; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #503484; }
  .photo { position: absolute; inset: 0; width: 1080px; height: 1350px; object-fit: cover; }
  .selo { position: absolute; right: 24px; bottom: 24px; width: 300px; height: auto; }
</style>
</head>
<body>
<div class="slide">
  <img class="photo" src="foto.jpg" alt="Pelúcia da Gotinha de Cura, uma gota roxa de feltro com olhos fechados, entre o spray Bem soninho, o sabonete baby e o creme Bem me quer">
  <img class="selo" src="../../assets/logos/selo-gota.png" alt="">
</div>
</body>
</html>
