<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #503484;
    font-family: 'Archivo', sans-serif;
    color: #ffffff;
  }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 100px 88px 180px;
    overflow: hidden; background: #503484; display: flex; flex-direction: column; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%;
    filter: grayscale(1) contrast(1.04) brightness(1.02); }
  .duo-shadow { position: absolute; inset: 0; background: #2a1a48; mix-blend-mode: lighten; }
  .duo-light { position: absolute; inset: 0; background: #f1cebb; mix-blend-mode: darken; }
  .scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(41,25,69,0.62) 0%, rgba(41,25,69,0.34) 34%, rgba(41,25,69,0.72) 68%, rgba(41,25,69,0.96) 100%); }
  .content { position: relative; display: flex; flex-direction: column; height: 100%; }
  .logo { width: 300px; height: auto; align-self: flex-start; filter: brightness(0) invert(1); }
  .foot { margin-top: auto; }
  h1 { font-family: 'Petrona', serif; font-weight: 600; letter-spacing: -0.022em;
    font-size: 74px; line-height: 1.05; max-width: 16ch; }
  h1 em { font-style: italic; font-weight: 500; color: #f0c8ae; }
  .lead { font-size: 32px; line-height: 1.5; color: rgba(255,255,255,0.86); margin-top: 26px; max-width: 26ch; }
  .progress { position: absolute; left: 88px; bottom: 90px; display: flex; gap: 10px; }
  .progress span { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .progress span.active { background: #dacbf9; }
</style>
</head>
<body>
<div class="slide">
  <img class="photo" src="cover.jpg" alt="Pessoa de roupa clara sentada na cama borrifando hidrolato sobre a roupa de cama na luz da manhã">
  <div class="duo-shadow"></div>
  <div class="duo-light"></div>
  <div class="scrim"></div>

  <div class="content">
    <img class="logo" src="logo.png" alt="Gota de Cura">
    <div class="foot">
      <h1>Bebê, gravidez, terceira idade: quando o óleo essencial <em>pede recuo</em></h1>
      <p class="lead">Nesses casos, o hidrolato deixa de ser coadjuvante e passa a ser a primeira escolha.</p>
    </div>
  </div>

  <div class="progress"><span class="active"></span><span></span><span></span><span></span><span></span><span></span></div>
</div>
</body>
</html>
